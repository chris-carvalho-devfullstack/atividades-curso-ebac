<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Lista de Tarefas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style/login.css">
</head>
<body>
  <div class="login-container">
    <h1>Cadastro</h1>
    <form id="signup-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
      </div>
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" required>
      </div>
      <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
    <p id="signup-error" class="error-message"></p>
  </div>

  <!-- Firebase JS -->
  <script type="module" src="js/firebase-config.js"></script>

  <script type="module">
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const auth = getAuth();
    const signupForm = document.getElementById("signup-form");
    const signupError = document.getElementById("signup-error");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        // Cria o usuário
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        // Redireciona direto para a tela principal (index.html) já logado
        window.location.href = "index.html";
      } catch (error) {
        console.error(error);
        signupError.textContent = "Erro ao cadastrar. Verifique email e senha.";
      }
    });
  </script>
</body>
</html>
