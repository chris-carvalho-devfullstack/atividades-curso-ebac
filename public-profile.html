<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css"> </head>
<body>
    <nav>
        </nav>

    <header class="task-form-header">
        <h1>Perfil Público</h1>
        <p id="public-username-header">@usuario</p>
    </header>

    <main class="profile-container">
    <div class="profile-header">
        <div class="cover-photo-container">
            <img id="cover-photo-preview" src="https://via.placeholder.com/800x250/e0e0e0/ffffff?text=+" alt="Foto de Capa">
        </div>
        <div class="profile-picture-section public-view">
            <img id="public-profile-image" src="https://via.placeholder.com/150" alt="Foto de Perfil">
        </div>
    </div>

    <div class="profile-card-info-only">
        <h2 id="public-fullname">Nome do Usuário</h2>
        <p id="public-username-header" class="username-display">@usuario</p>

        <div class="bio-section">
            <h3>Sobre mim</h3>
            <p id="public-bio">Este usuário ainda não escreveu uma bio.</p>
        </div>

        <div class="info-grid">
            </div>
    </div>
</main>
    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth-listener.js"></script>
    <script type="module" src="nav-profile.js"></script> <script type="module" src="public-profile.js"></script> </body>
</html>
