<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css"> </head>
<body>
    <nav>
        </nav>

    <header class="task-form-header">
        <h1>Perfil Público</h1>
        <p id="public-username-header">@usuario</p>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-picture-section">
                <img id="public-profile-image" src="https://via.placeholder.com/150" alt="Foto de Perfil">
            </div>

            <div class="profile-info-section">
                <h2 id="public-fullname">Nome do Usuário</h2>
                
                <div class="info-item">
                    <i class="fa fa-calendar-days"></i>
                    <span id="public-birthdate">Data de Nascimento</span>
                </div>
                <div class="info-item">
                    <i class="fa fa-phone"></i>
                    <span id="public-phone">Telefone de Contato</span>
                </div>
                <div class="info-item">
                    <i class="fa-brands fa-instagram"></i>
                    <span id="public-instagram">@instagram</span>
                </div>
                <div class="info-item">
                    <i class="fa-brands fa-linkedin"></i>
                    <a href="#" id="public-linkedin" target="_blank">Perfil no LinkedIn</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth-listener.js"></script>
    <script type="module" src="nav-profile.js"></script> <script type="module" src="public-profile.js"></script> </body>
</html>
