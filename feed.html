<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/feed.css">
    <link rel="stylesheet" href="style/notifications.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <header class="task-form-header">
        <h1>Feed de Atividades</h1>
        <p>Veja o que seus amigos estão fazendo e compartilhe suas conquistas.</p>
    </header>

    <main class="feed-container">
        <div class="create-post-card">
            <h2>Criar Publicação</h2>
            <form id="create-post-form">
                <div id="post-content" class="editable-textarea" contenteditable="true" data-placeholder="No que você está pensando?"></div>
                <div class="post-actions">
                    <input type="file" id="post-image-upload" accept="image/*" style="display: none;">
                    <button type="button" id="add-image-btn"><i class="fa fa-camera"></i> Adicionar Imagem</button>
                    <button type="submit">Publicar</button>
                </div>
                <div id="image-preview-container" style="display: none;">
                    <img id="image-preview" src="#" alt="Preview da Imagem"/>
                    <button id="remove-image-btn">&times;</button>
                </div>
            </form>
        </div>

        <div id="feed-posts">
            <!-- As publicações serão carregadas aqui -->
        </div>
    </main>

    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <!-- MODAL DE CONFIRMAÇÃO ADICIONADO -->
    <div id="confirmModal" class="modal">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h2 id="confirm-modal-title">Confirmar Ação</h2>
            </div>
            <div class="modal-body">
                <p id="confirm-modal-text">Você tem certeza?</p>
            </div>
            <div class="modal-footer">
                <button id="confirm-modal-ok-btn" class="btn-danger">Confirmar</button>
                <button id="confirm-modal-cancel-btn" class="btn-neutral">Cancelar</button>
            </div>
        </div>
    </div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth-listener.js"></script>
<script type="module" src="js/nav.js"></script>
<script type="module" src="js/feed.js"></script>
</body>
</html>
