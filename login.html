<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Cadastro - Lista de Tarefas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="form-wrapper">
      <!-- LOGIN -->
      <form id="login-form" class="form active">
        <h1>Entrar</h1>
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Digite seu email" required>
        </div>
        <div class="input-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="Digite sua senha" required>
        </div>
        <button type="submit">Entrar</button>
        <button type="button" id="google-login-btn" class="google-btn">
          <i class="fa-brands fa-google"></i> Entrar com Google
        </button>
        <p>Não tem conta? <span id="show-signup">Cadastre-se</span></p>
        <p id="login-error" class="error-message"></p>
      </form>

      <!-- SIGNUP -->
      <form id="signup-form" class="form">
        <h1>Cadastro</h1>
        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="Digite seu email" required>
        </div>
        <div class="input-group">
          <label for="signup-password">Senha</label>
          <input type="password" id="signup-password" placeholder="Digite sua senha" required>
        </div>
        <button type="submit">Cadastrar</button>
        <p>Já tem conta? <span id="show-login">Entrar</span></p>
        <p id="signup-error" class="error-message"></p>
      </form>
    </div>
  </div>

  <!-- Firebase e JS -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth-listener.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
