<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Avançado</title>
    <link rel="stylesheet" href="pomodoro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="pomodoro-header">
        <h1>Pomodoro Avançado</h1>
        <p>Selecione uma tarefa e acompanhe seus Pomodoros</p>
    </div>

    <div class="pomodoro-main">
        <div class="task-selector">
            <select id="pomodoro-task">
                <option value="">Nenhuma tarefa selecionada</option>
            </select>
        </div>

        <div class="timer-container">
            <svg class="timer-svg" width="250" height="250">
                <circle class="bg-circle" cx="125" cy="125" r="100"></circle>
                <circle class="progress-circle" cx="125" cy="125" r="100"></circle>
            </svg>
            <div class="timer-text">
                <h2 id="timer">25:00</h2>
                <p id="session-type">Sessão: Pomodoro</p>
            </div>
        </div>

        <div class="timer-controls">
            <button id="start-btn"><i class="fa fa-play"></i> Iniciar</button>
            <button id="pause-btn"><i class="fa fa-pause"></i> Pausar</button>
            <button id="reset-btn"><i class="fa fa-rotate-left"></i> Resetar</button>
            <button id="skip-btn"><i class="fa fa-forward"></i> Pular</button>
        </div>

        <p id="current-task">Tarefa atual: Nenhuma</p>

        <h2>Histórico de Pomodoros</h2>
        <table id="pomodoro-history">
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Sessão</th>
                    <th>Data/Hora</th>
                    <th>Duração (min)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="history-controls" style="margin-top: 10px;">
            <button id="reset-history-btn" style="background:#f44336;color:white;padding:8px 12px;border:none;border-radius:5px;margin-right:5px;cursor:pointer;">
                <i class="fa fa-trash"></i> Resetar Histórico
            </button>
            <button id="export-history-btn" style="background:#4CAF50;color:white;padding:8px 12px;border:none;border-radius:5px;cursor:pointer;">
                <i class="fa fa-download"></i> Exportar CSV
            </button>
        </div>
    </div>

    <footer>
        Desenvolvido por Christian de Carvalho
    </footer>

    <button id="dark-mode-toggle" class="dark-mode-btn">
        <i class="fa-solid fa-moon"></i>
    </button>

    <audio id="alarm-sound" src="https://www.soundjay.com/buttons/sounds/beep-07.mp3" preload="auto"></audio>
    
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth-listener.js"></script>
<script type="module" src="js/nav.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="js/pomodoro.js"></script>
</body>
</html>
