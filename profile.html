<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
            <li><a href="pomodoro.html"><i class="fa-solid fa-clock"></i> Pomodoro</a></li>
            <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Perfil</a></li>
            <li><a href="#"><i class="fa-solid fa-circle-info"></i> Sobre</a></li>
            <li><button id="logout-btn" class="btn-logout"><i class="fa fa-right-from-bracket"></i> Sair</button></li>
        </ul>
    </nav>

    <header class="task-form-header">
        <h1>Meu Perfil</h1>
        <p>Gerencie suas informações pessoais e configurações.</p>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-picture-section">
                <img id="profile-image-preview" src="https://via.placeholder.com/150" alt="Foto de Perfil">
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button id="change-picture-btn" class="btn-neutral"><i class="fa fa-camera"></i> Alterar Foto</button>
            </div>

            <div class="profile-info-section">
                <form id="profile-form">
                    <div class="input-group">
                        <label for="profile-name">Nome de Exibição</label>
                        <input type="text" id="profile-name" placeholder="Como você quer ser chamado?">
                    </div>
                    <div class="input-group">
                        <label for="profile-contact">Contato (Telefone ou Rede Social)</label>
                        <input type="text" id="profile-contact" placeholder="Seu contato (opcional)">
                    </div>
                    <div class="input-group">
                        <label for="profile-email">Email</label>
                        <input type="email" id="profile-email" disabled>
                        <small>O email não pode ser alterado.</small>
                    </div>
                    <button type="submit" id="save-profile-btn" class="btn-primary">Salvar Alterações</button>
                </form>
                <p id="profile-message" class="message"></p>
            </div>
        </div>
    </main>

    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth-listener.js"></script>
    <script type="module" src="logout.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
