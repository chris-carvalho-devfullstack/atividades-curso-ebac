<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <header class="task-form-header">
        <h1>Editar Perfil</h1>
        <p>Mantenha suas informações pessoais e de contato atualizadas.</p>
    </header>

    <main class="profile-container">
        <div class="profile-header">
            <div class="cover-photo-container">
                <img id="cover-photo-preview" src="https://via.placeholder.com/800x250/e0e0e0/ffffff?text=+" alt="Foto de Capa">
                <input type="file" id="cover-upload" accept="image/*" style="display: none;">
                <button type="button" id="change-cover-btn" class="btn-change-cover"><i class="fa fa-camera"></i> Alterar Capa</button>
            </div>
            <div class="profile-picture-section">
                <img id="profile-image-preview" src="https://via.placeholder.com/150" alt="Foto de Perfil">
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button type="button" id="change-picture-btn" class="btn-change-picture"><i class="fa fa-camera"></i></button>
            </div>
        </div>
        <div class="profile-card-info-only">
            <form id="profile-form">
                <div class="input-group">
                    <label for="profile-fullname"><i class="fa fa-user"></i> Nome Completo</label>
                    <input type="text" id="profile-fullname" placeholder="Seu nome completo">
                </div>

                <div class="input-group">
                    <label for="profile-username"><i class="fa fa-at"></i> Nome de Usuário</label>
                    <input type="text" id="profile-username" placeholder="Ex: @seunome" maxlength="15">
                    <small>Seu nome de usuário público. Deve ser único.</small>
                </div>
                
                <div class="input-group">
                    <label for="profile-bio"><i class="fa fa-info-circle"></i> Sobre mim</label>
                    <textarea id="profile-bio" placeholder="Escreva uma breve biografia..." rows="3" maxlength="200"></textarea>
                </div>

                <div class="input-group">
                    <label for="profile-birthdate"><i class="fa fa-calendar-days"></i> Data de Nascimento</label>
                    <input type="date" id="profile-birthdate">
                </div>
                
                <div class="input-group">
                    <label for="profile-gender"><i class="fa fa-venus-mars"></i> Gênero</label>
                    <select id="profile-gender">
                        <option value="not-informed">Prefiro não informar</option>
                        <option value="male">Masculino</option>
                        <option value="female">Feminino</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="profile-phone"><i class="fa fa-phone"></i> Celular</label>
                    <input type="tel" id="profile-phone" placeholder="(99) 9 9999-9999" maxlength="15">
                </div>

                <div class="input-group">
                    <label for="profile-instagram"><i class="fa-brands fa-instagram"></i> Instagram</label>
                    <input type="text" id="profile-instagram" placeholder="@seu-perfil">
                </div>

                <div class="input-group">
                    <label for="profile-linkedin"><i class="fa-brands fa-linkedin"></i> LinkedIn</label>
                    <input type="url" id="profile-linkedin" placeholder="https://linkedin.com/in/seu-perfil">
                </div>

                <div class="input-group">
                    <label for="profile-email"><i class="fa fa-envelope"></i> Email</label>
                    <input type="email" id="profile-email" disabled>
                    <small>O email não pode ser alterado.</small>
                </div>
                
                <div class="profile-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                    <button type="submit" id="save-profile-btn" class="btn-primary">Salvar Alterações</button>
                    <button type="button" id="share-profile-btn" class="btn-neutral">
                        <i class="fa fa-share-alt"></i> Compartilhar Perfil
                    </button>
                </div>
            </form>
            <p id="profile-message" class="message"></p>
        </div>
    </main>

    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <div id="infoModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h2 id="info-modal-title">Aviso</h2>
                <button id="info-modal-close-top" class="close-top-right">&times;</button>
            </div>
            <div class="modal-body">
                <p id="info-modal-text">Mensagem de exemplo.</p>
            </div>
            <div class="modal-footer">
                <button id="info-modal-close-btn" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth-listener.js"></script>
    <script type="module" src="nav.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
