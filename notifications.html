<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <header class="task-form-header">
        <h1>Suas Notificações</h1>
        <p>Veja aqui todas as suas atualizações e interações.</p>
    </header>

    <main class="notifications-container">
        <div class="notifications-header">
            <button id="mark-all-as-read-btn" class="btn-neutral">Marcar todas como lidas</button>
        </div>
        <ul id="notifications-list">
            <li class="notification-item placeholder">
                <i class="fa fa-spinner fa-spin"></i> Carregando notificações...
            </li>
        </ul>
    </main>

    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth-listener.js"></script>
    <script type="module" src="nav.js"></script> 
    <script type="module" src="notifications.js"></script>
</body>
</html>
