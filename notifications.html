<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <header class="task-form-header">
        <h1>Central de Notificações</h1>
        <p>Veja e gerencie suas atualizações e interações.</p>
    </header>

    <main class="notifications-container">

        <div class="notifications-tabs">
            <button id="tab-notifications" class="tab-link active" data-tab="notifications-view">
                <i class="fa-solid fa-inbox"></i> Caixa de Entrada
            </button>
            <button id="tab-logs" class="tab-link" data-tab="logs-view">
                <i class="fa-solid fa-history"></i> Histórico (Logs)
            </button>
        </div>

        <div id="notifications-view" class="tab-content active">
            <div class="notifications-header">
                <div class="notification-actions">
                    <button id="select-all-btn" class="btn-neutral btn-small" title="Selecionar/Desselecionar Todas" disabled>
                        <i class="fa-regular fa-square"></i> <span>Selecionar Todas</span>
                    </button>
                    <button id="delete-selected-btn" class="btn-danger btn-small" disabled>
                        <i class="fa fa-trash"></i> <span>Apagar Selecionadas</span>
                    </button>
                </div>
                <button id="mark-all-as-read-btn" class="btn-neutral" disabled>
                    <i class="fa-solid fa-check-double"></i> <span>Marcar como Lidas</span>
                </button>
            </div>
            <ul id="notifications-list">
                <li class="notification-item placeholder">
                    <i class="fa fa-spinner fa-spin"></i> Carregando notificações...
                </li>
                </ul>
        </div>

        <div id="logs-view" class="tab-content">
            <div class="notifications-header">
                <h3>Histórico de Notificações</h3>
                <button id="empty-logs-btn" class="btn-danger" disabled>
                    <i class="fa-solid fa-eraser"></i> Esvaziar Logs
                </button>
            </div>
            <ul id="notification-log-list">
                 <li class="notification-item placeholder">
                    <i class="fa fa-spinner fa-spin"></i> Carregando logs...
                </li>
                </ul>
        </div>
    </main>

    <footer>
        <p>Desenvolvido como atividade do Curso de Programação Full Stack Python da EBAC</p>
    </footer>

    <div id="confirmModal" class="modal" style="display: none;">
      <div class="modal-content" style="max-width: 420px;">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Confirmar Ação</h2>
        </div>
        <div class="modal-body">
          <p id="confirm-modal-text">Você tem certeza?</p>
        </div>
        <div class="modal-footer">
          <button id="confirm-modal-ok-btn" class="btn-danger">Confirmar</button>
          <button id="confirm-modal-cancel-btn" class="btn-neutral">Cancelar</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-listener.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/notifications.js"></script>

</body>
</html>
